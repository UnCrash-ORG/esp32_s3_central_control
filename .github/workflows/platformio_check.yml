name: PlatformIO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platformio_ci:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-${{ hashFiles('.github/workflows/platformio_check.yml') }}
          restore-keys: |
            pip-${{ runner.os }}-py312-

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Run static analysis
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          pio check --skip-packages --fail-on-defect medium --fail-on-defect high 2>&1 | tee pio-check-output.txt

      - name: Comment on PR if check failed
        if: steps.check.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let output = 'Unable to read check output.';
            try { output = fs.readFileSync('pio-check-output.txt', 'utf8'); } catch (e) {}
            output = output.replace(/\x1B\[[0-9;]*[mK]/g, '');
            const MAX_LEN = 60000;
            let truncated = output.length > MAX_LEN;
            if (truncated) output = output.slice(0, MAX_LEN);
            const body = [
              '## ❌ Static Analysis Failed',
              '',
              'PlatformIO `pio check` reported defects. Please review and fix them before merging.',
              '',
              `🔗 [View full CI logs](${runUrl})`,
              '',
              '```',
              output.trim(),
              '```',
              truncated ? '\n> ⚠️ Output truncated. See CI logs for the full result.' : ''
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });


      - name: Fail if static analysis failed
        if: steps.check.outcome == 'failure'
        run: exit 1

      - name: Cache firmware build files
        uses: actions/cache@v4
        with:
          path: |
            .pio/build
            managed_components
          key: pio-build-v1-${{ runner.os }}-${{ hashFiles('platformio.ini', 'dependencies.lock', 'sdkconfig.*', '**/CMakeLists.txt', '**/idf_component.yml', 'partitions.csv') }}
          restore-keys: |
            pio-build-v1-${{ runner.os }}-

      - name: Build firmware
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pio run 2>&1 | tee pio-build-output.txt

      - name: Comment on PR if build failed
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let output = 'Unable to read build output.';
            try { output = fs.readFileSync('pio-build-output.txt', 'utf8'); } catch (e) {}
            output = output.replace(/\x1B\[[0-9;]*[mK]/g, '');

            const lines = output.split('\n');
            const errorLines = lines.filter(l =>
              /error:|fatal error:|undefined reference|multiple definition|ninja: build stopped/i.test(l)
            );
            let excerpt = errorLines.length > 0
              ? errorLines.slice(0, 200).join('\n')
              : lines.slice(-200).join('\n');

            const MAX_LEN = 60000;
            let truncated = excerpt.length > MAX_LEN;
            if (truncated) excerpt = excerpt.slice(0, MAX_LEN);

            const body = [
              '## ❌ Firmware Build Failed',
              '',
              '`pio run` failed. See the error excerpt below (full log via the link).',
              '',
              `🔗 [View full CI logs](${runUrl})`,
              '',
              '```',
              excerpt.trim(),
              '```',
              truncated ? '\n> ⚠️ Excerpt truncated. See CI logs for the full result.' : ''
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });


      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload firmware
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware
          path: .pio/build/esp32-s3-devkitc-1/*.bin
          if-no-files-found: error